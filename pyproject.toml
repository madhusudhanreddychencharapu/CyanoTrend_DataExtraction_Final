[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyanotrend-final"
version = "0.2.0"
description = "Notebook-equivalent adaptive Sentinel-3 OLCI lake processing with a persistent parallel queue"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2", "geopandas>=0.14", "shapely>=2", "pyogrio>=0.7", "pyproj>=3.5", "netCDF4>=1.6", "scipy>=1.10", "requests>=2.31", "boto3>=1.28", "tqdm>=4.65"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cyanotrend = "cyanotrend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
